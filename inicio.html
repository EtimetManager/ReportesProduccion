<style>
/* Menú de inicio en las PCs de planta: el operador elige su proceso. */
:root { --bg: #eceeec; --ink: #1d2422; --muted: #5d6865; --azul: #1B4079; --azul-claro: #1068B0; --verde: #009038; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
img { width: 150px; height: auto; }
h1 { font-size: 24px; margin: 12px 0 4px; text-align: center; }
p { color: var(--muted); margin: 0 0 24px; text-align: center; }
nav { display: grid; gap: 16px; width: 100%; max-width: 520px; }
a { display: block; padding: 22px 20px; border-radius: 10px; color: #fff; text-decoration: none; font-size: 22px; font-weight: bold; }
a small { display: block; font-size: 14px; font-weight: normal; opacity: .9; margin-top: 4px; }
a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.impr { background: var(--azul); } .troq { background: var(--azul-claro); } .corte { background: var(--verde); }
</style>
